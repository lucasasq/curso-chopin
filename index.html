<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Curso Chopin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#34418F">
<link rel="apple-touch-icon" href="img/icone-192.png">
<meta name="apple-mobile-web-app-title" content="Curso Chopin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fixa; vistas por hash (#curso, #aula-x-y, #progresso). Na aula, o palco do teclado ocupa a largura toda — no iPad deitado, ele é o que fica na estante. */
:root {
  --bg: #F2F3F6;
  --surface: #FFFFFF;
  --surface-2: #E9EBF0;
  --ink: #15171D;
  --muted: #586071;
  --line: #D7DAE2;
  --accent: #34418F;
  --accent-soft: #E3E6F6;
  --accent-ink: #FFFFFF;
  --rh: #A8760C;
  --lh: #11737B;
  --ok: #2B7A4B;
  --warn: #A9611B;
  --bad: #B03636;
  --stage: #12141B;
  --stage-line: #262A36;
  --stage-text: #C7CBD6;
  --key-white: #F7F5EF;
  --key-black: #1A1A1F;
  --key-edge: #A9ADB8;
  --press: #7C8CFF;
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F14; --surface: #151821; --surface-2: #1D2130; --ink: #E7E9EF; --muted: #9BA1B2;
    --line: #2A2F3D; --accent: #A3ADFF; --accent-soft: #232845; --accent-ink: #10132A;
    --rh: #E2B24C; --lh: #45BDC5; --ok: #5DC28A; --warn: #E49A50; --bad: #E46B6B;
    --stage: #0A0B10; --stage-line: #1F2330; --stage-text: #B9BECB; --press: #8C9BFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F14; --surface: #151821; --surface-2: #1D2130; --ink: #E7E9EF; --muted: #9BA1B2;
  --line: #2A2F3D; --accent: #A3ADFF; --accent-soft: #232845; --accent-ink: #10132A;
  --rh: #E2B24C; --lh: #45BDC5; --ok: #5DC28A; --warn: #E49A50; --bad: #E46B6B;
  --stage: #0A0B10; --stage-line: #1F2330; --stage-text: #B9BECB; --press: #8C9BFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; }

/* barra superior */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topo .wrap { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.marca {
  font-family: var(--font-display); font-style: italic; font-weight: 500;
  font-size: 1.45rem; letter-spacing: 0.01em; text-decoration: none; color: var(--ink);
  font-variation-settings: "opsz" 48;
}
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a {
  text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; font-weight: 500;
}
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.pill {
  margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: 0.875rem; font-weight: 500; color: var(--ink); min-height: 36px;
}
.pill .ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.pill[data-estado="conectado"] .ponto { background: var(--ok); }
.pill[data-estado="sem-piano"] .ponto, .pill[data-estado="pedir"] .ponto { background: var(--warn); }
.pill[data-estado="sem-suporte"] .ponto, .pill[data-estado="negado"] .ponto { background: var(--bad); }

main { padding-block: 28px 64px; }
.vista[hidden] { display: none !important; }

h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 {
  font-family: var(--font-display); font-weight: 500; font-size: clamp(2rem, 4.4vw, 3.1rem);
  line-height: 1.08; letter-spacing: -0.01em; font-variation-settings: "opsz" 96;
}
h2 {
  font-family: var(--font-display); font-weight: 500; font-size: clamp(1.45rem, 2.6vw, 1.9rem);
  line-height: 1.15; font-variation-settings: "opsz" 72;
}
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
.rotulo {
  font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
}
.texto { max-width: 66ch; color: var(--ink); }
.suave { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; min-height: 44px;
  padding: 10px 18px; border: 1px solid var(--line); background: var(--surface); font-weight: 600;
  text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primario:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn .ico { width: 16px; height: 16px; flex: none; }

.secao { display: grid; gap: 18px; padding-block: 36px 0; }
.secao + .secao { border-top: 1px solid var(--line); margin-top: 36px; }

/* ---------- curso ---------- */
.abertura { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.abertura .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.abertura .intro { display: grid; gap: 16px; }
.posicao {
  background: var(--stage); border-radius: var(--radius); padding: 18px 18px 14px; display: grid; gap: 10px;
}
.posicao canvas { width: 100%; height: 150px; display: block; }
.posicao p { color: var(--stage-text); font-size: 0.875rem; }

.principios { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 28px; }
.principios div { display: grid; gap: 4px; align-content: start; }
.principios p { color: var(--muted); font-size: 0.95rem; }

.rotina { display: grid; gap: 10px; }
.rotina-barra { display: flex; border-radius: 8px; overflow: hidden; min-height: 54px; border: 1px solid var(--line); }
.rotina-barra div {
  padding: 8px 10px; display: grid; align-content: center; min-width: 0; border-right: 1px solid var(--line);
  background: var(--surface);
}
.rotina-barra div:last-child { border-right: 0; background: var(--surface-2); }
.rotina-barra b { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rotina-barra span { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.rotina-lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 20px; font-size: 0.9rem; }
.rotina-lista span { color: var(--muted); }

.modulos { display: grid; gap: 0; border-top: 1px solid var(--line); }
.modulo {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 20px; padding-block: 22px;
  border-bottom: 1px solid var(--line);
}
.modulo .num {
  font-family: var(--font-display); font-size: 2.3rem; line-height: 1; color: var(--accent);
  font-variation-settings: "opsz" 96; grid-row: span 2;
}
.modulo[data-pronto="false"] .num { color: var(--muted); }
.modulo .cab { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.modulo .corpo { display: grid; gap: 10px; min-width: 0; }
.modulo .ideia { color: var(--muted); max-width: 70ch; }
.aulas { display: grid; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
.aulas li { display: flex; align-items: center; gap: 10px; min-width: 0; }
.aulas a, .aulas .plano {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  padding: 6px 0; min-width: 0;
}
.aulas a:hover .t { color: var(--accent); text-decoration: underline; }
.aulas .id { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); width: 2.4em; flex: none; }
.aulas .t { min-width: 0; }
.chip {
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase;
  border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; flex: none;
}
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.chip.andamento { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.plano .t { color: var(--muted); }
.ouvir-link { font-size: 0.9rem; }
.depois { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.depois li { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; background: var(--surface); }
.fontes { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; color: var(--muted); font-size: 0.9rem; }

/* ---------- aula ---------- */
.aula-cab { display: grid; gap: 10px; }
.aula-cab .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.aula-cab .meta span { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.navaulas { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.narracao {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
}
.narracao .play {
  width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; grid-row: span 2;
}
.narracao .play svg { width: 18px; height: 18px; }
.narracao .qual { font-weight: 600; }
.narracao details { grid-column: 2; }
.narracao summary { color: var(--muted); font-size: 0.875rem; cursor: pointer; }
.narracao details p { margin-top: 8px; color: var(--muted); max-width: 70ch; font-size: 0.95rem; }

.player { display: grid; gap: 10px; }
.controles { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button {
  border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 600; color: var(--muted); min-height: 38px;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.campo { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
.campo input[type="range"] { width: 130px; accent-color: var(--accent); }
.campo b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; min-width: 4.6em; font-variant-numeric: tabular-nums; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--muted); min-height: 38px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }

.palco {
  position: relative; background: var(--stage); border-radius: var(--radius); overflow: hidden;
  height: clamp(300px, 58vh, 520px); touch-action: manipulation;
}
.palco canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.transporte { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.transporte .tocar { min-width: 140px; justify-content: center; }
.barra-prog { flex: 1 1 160px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; min-width: 120px; }
.barra-prog div { height: 100%; width: 0; background: var(--accent); }
.secoes-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.secoes-chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; min-height: 34px; }
/* foco ao tocar: só o teclado, as mãos, o treinador e o transporte */
body.foco .narracao, body.foco .figuras, body.foco .aula-cab, body.foco .hoje-cab, body.foco .guia-barra, body.foco .controles,
body.foco .aula-info, body.foco .criterio, body.foco .plano-estudo, body.foco .peca-box, body.foco .hoje-rodape, body.foco .navaulas,
body.foco .leitura-aviso, body.foco #resultado, body.foco .topo, body.foco .ativar-som, body.foco .player:not(.leitura) .partitura, body.foco .tabela-wrap, body.foco h2, body.foco h3 { display: none !important; }
body.foco main { padding-top: 8px; }
/* treino de ouvido */
.ouvido-card.feito { border-left: 4px solid var(--ok); }
.ouvido-painel { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.ouvido-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.ouvido-palco { height: clamp(120px, 22vh, 190px); cursor: pointer; touch-action: manipulation; }
.ouvido-painel select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
/* aula guiada (fluxo automático): sem barra do topo, sem textos de apoio; fica a explicação visual, o teclado e o resultado */
body.guiado .topo, body.guiado .controles, body.guiado .aula-info, body.guiado .criterio, body.guiado .plano-estudo, body.guiado .tabela-wrap,
body.guiado .navaulas, body.guiado .leitura-aviso, body.guiado .narracao, body.guiado .aula-cab p, body.guiado .hoje-cab p, body.guiado .passos-dia, body.guiado .peca-info .texto { display: none !important; }
body.guiado main { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
body.guiado .aula-cab h1, body.guiado .hoje-cab h1 { font-size: 1.3rem; }
.guiado-sair { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 10; display: none; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; min-height: 34px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
body.guiado:not(.foco) .guiado-sair { display: inline-flex; }
body.foco .palco { height: clamp(360px, 62vh, 640px); }
body.foco .transporte::after { content: "Modo foco: a tela volta ao normal quando você pausa ou termina."; font-size: 0.8rem; color: var(--muted); flex-basis: 100%; }
.status { font-size: 0.95rem; color: var(--muted); min-height: 1.5em; }
.treinador { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); padding: 10px 14px; min-height: 56px; }
.tr-msg { font-size: 1rem; color: var(--muted); }
.tr-msg[data-tipo="errada"] { color: var(--bad); }
.tr-msg[data-tipo="atrasou"], .tr-msg[data-tipo="apressou"] { color: var(--warn); }
.tr-msg[data-tipo="bem"] { color: var(--ok); }
.treinador:has(.tr-msg[data-tipo="errada"]) { border-left-color: var(--bad); }
.treinador:has(.tr-msg[data-tipo="atrasou"]), .treinador:has(.tr-msg[data-tipo="apressou"]) { border-left-color: var(--warn); }
.treinador:has(.tr-msg[data-tipo="bem"]) { border-left-color: var(--ok); }
.tr-msg.pisca { animation: tr-pisca 0.5s ease-out; }
@keyframes tr-pisca { 0% { transform: translateX(-4px); } 30% { transform: translateX(4px); } 100% { transform: none; } }
.tr-barras { display: flex; align-items: flex-end; gap: 3px; height: 42px; }
.tr-barras i { display: block; width: 7px; border-radius: 2px 2px 0 0; background: var(--ok); }
.tr-barras i.tarde { background: var(--warn); } .tr-barras i.cedo { background: var(--lh); }
.linha-tempo { display: grid; gap: 8px; }
.din-grade { display: flex; gap: 3px; align-items: flex-end; height: 90px; border-bottom: 1px solid var(--line); padding: 0 4px 16px; overflow-x: auto; position: relative; }
.din-col { position: relative; flex: 1 0 12px; min-width: 12px; max-width: 30px; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 1px; }
.din-col i { display: block; width: 45%; border-radius: 2px 2px 0 0; }
.din-col i.pedido { background: var(--accent-soft); border: 1px solid var(--accent); }
.din-col i.tocado { background: var(--rh); }
.din-col span { position: absolute; left: 0; right: 0; bottom: -16px; text-align: center; font: italic 700 0.65rem Georgia, serif; color: var(--muted); }
.lt-grade { display: flex; gap: 2px; align-items: stretch; height: 70px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; overflow-x: auto; padding: 0 4px; }
.lt-grade::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--muted); opacity: 0.5; }
.lt-col { position: relative; flex: 1 0 10px; min-width: 10px; max-width: 28px; }
.lt-col i { position: absolute; left: 15%; right: 15%; background: var(--ok); border-radius: 2px; }
.lt-col.tarde i { background: var(--warn); } .lt-col.cedo i { background: var(--lh); } .lt-col.erro i { background: var(--bad); }
.lt-col.erro::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--bad); }
.lt-col span { position: absolute; left: 0; right: 0; bottom: -16px; text-align: center; font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); }
.lt-col:nth-child(n+2):not(:nth-child(4n+1)) span { visibility: hidden; }
.lt-grade { margin-bottom: 16px; }
@media (max-width: 560px) { .treinador { grid-template-columns: 1fr; } }
.player.leitura .palco, .player.leitura .maos { display: none; }
.leitura-aviso { border-left: 3px solid var(--accent); padding-left: 12px; }
.abertura-fig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; }
.abertura-fig img { width: 100%; height: auto; display: block; background: #FBF8F1; }
.abertura-fig figcaption { padding: 10px 14px 12px; font-size: 0.9rem; color: var(--muted); }
.partitura { background: #FBF8F1; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; overflow-x: auto; }
.partitura svg { display: block; max-width: 100%; height: auto; }
.partitura[hidden] { display: none !important; }
.partitura .nota-atual path, .partitura .nota-atual text { fill: var(--press) !important; stroke: var(--press) !important; }
.partitura .nota-atual { filter: drop-shadow(0 0 3px var(--press)); }
.status b { color: var(--ink); }

.aula-info { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 28px; }
.aula-info ol, .aula-info ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 6px; }
.criterio { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin-top: 18px; }
.criterio p { margin-top: 4px; }

.resultado {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 16px;
}
.resultado[data-passou="true"] { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
.veredito { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.veredito .selo {
