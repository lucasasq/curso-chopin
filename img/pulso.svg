<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Animação: o pulso sobe e deixa a mão cair na tecla, como uma bola quicando; o staccato de pulso">
  <defs>
    <style>
      .fundo{fill:#12141B}
      .tecla{fill:#F7F5EF;stroke:#A9ADB8;stroke-width:1}
      .preta{fill:#1A1A1F}
      .mao{fill:none;stroke:#45BDC5;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
      .dedo{fill:none;stroke:#45BDC5;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .rot{fill:#9BA1B2;font:500 13px ui-monospace,Menlo,monospace;letter-spacing:.06em}
      .bola{fill:#45BDC5;opacity:.9}
      .guia{fill:none;stroke:#8C9BFF;stroke-width:2;stroke-dasharray:6 6}
      .ok{fill:#5DC28A;font:600 15px system-ui,-apple-system,sans-serif}
    </style>
  </defs>
  <rect class="fundo" width="640" height="400" rx="10"/>
  <text class="rot" x="24" y="34">PULSO SOLTO · O PULSO SOBE E A MÃO CAI NA TECLA, COMO UMA BOLA QUICANDO</text>

  <!-- teclado de lado -->
  <rect class="tecla" x="60" y="300" width="400" height="22" rx="3"/>
  <rect class="preta" x="60" y="288" width="230" height="14" rx="2"/>
  <!-- a tecla afunda quando a mão cai -->
  <rect class="tecla" x="330" y="300" width="60" height="22" rx="3">
    <animate attributeName="y" values="300;300;306;300;300;306;300;300" keyTimes="0;.33;.37;.5;.73;.77;.9;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- mão: o cotovelo fica parado (à esquerda); o pulso é a dobradiça -->
  <g>
    <!-- antebraço fixo -->
    <path class="mao" d="M70 250 L230 250"/>
    <!-- pulso + mão em concha: sobe (rotação no pulso) e cai -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 230 250;-22 230 250;-22 230 250;0 230 250;0 230 250;-22 230 250;-22 230 250;0 230 250;0 230 250" keyTimes="0;.18;.28;.35;.5;.6;.68;.75;1" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".2 0 .4 1;.2 0 .4 1;.5 0 1 1;.2 0 .4 1;.2 0 .4 1;.2 0 .4 1;.5 0 1 1;.2 0 .4 1"/>
      <path class="mao" d="M230 250 Q290 222 326 236"/>
      <path class="dedo" d="M326 236 Q365 234 372 262 Q375 284 368 298"/>
      <path class="dedo" d="M244 258 Q272 284 300 296"/>
    </g>
  </g>

  <!-- a bola que quica, ao lado, como comparação -->
  <g>
    <line class="guia" x1="500" y1="322" x2="600" y2="322"/>
    <circle class="bola" cx="550" cy="304" r="18">
      <animate attributeName="cy" values="304;214;214;304;304;214;214;304;304" keyTimes="0;.18;.28;.35;.5;.6;.68;.75;1" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".2 0 .4 1;.2 0 .4 1;.5 0 1 1;.2 0 .4 1;.2 0 .4 1;.2 0 .4 1;.5 0 1 1;.2 0 .4 1"/>
      <animate attributeName="r" values="18;16;16;18;18;16;16;18;18" keyTimes="0;.18;.28;.35;.5;.6;.68;.75;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text class="ok" x="24" y="372">✓ o cotovelo não sobe; só o pulso. Se cansar ou travar, pare e sacuda a mão</text>
</svg>
