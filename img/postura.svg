<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Animação: ajuste do banco até o antebraço ficar na altura do teclado, cotovelos um pouco à frente do corpo, pés no chão">
  <defs>
    <style>
      .fundo{fill:#12141B}
      .chao{stroke:#262A36;stroke-width:2}
      .piano{fill:#1D2130;stroke:#3A4055;stroke-width:2}
      .tecla{fill:#F7F5EF}
      .preta{fill:#1A1A1F}
      .corpo{fill:none;stroke:#C7CBD6;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      .cabeca{fill:#C7CBD6}
      .banco{fill:#2B3042;stroke:#3A4055;stroke-width:2}
      .guia{stroke:#8C9BFF;stroke-width:2;stroke-dasharray:6 6}
      .ok{fill:#5DC28A;font:600 15px system-ui,-apple-system,sans-serif}
      .rot{fill:#9BA1B2;font:500 13px ui-monospace,Menlo,monospace;letter-spacing:.06em}
      .mau{fill:#E46B6B;font:600 15px system-ui,-apple-system,sans-serif}
    </style>
  </defs>
  <rect class="fundo" width="640" height="400" rx="10"/>
  <text class="rot" x="24" y="34">ALTURA DO BANCO · O ANTEBRAÇO NA ALTURA DAS TECLAS</text>
  <!-- chão -->
  <line class="chao" x1="20" y1="360" x2="620" y2="360"/>

  <!-- piano, visto de lado (direita) -->
  <g>
    <rect class="piano" x="420" y="150" width="190" height="210" rx="6"/>
    <rect class="piano" x="400" y="230" width="60" height="18" rx="3"/>
    <rect class="tecla" x="402" y="226" width="56" height="8" rx="2"/>
    <rect class="preta" x="402" y="222" width="34" height="5" rx="1"/>
    <!-- linha da altura do teclado -->
    <line class="guia" x1="150" y1="230" x2="400" y2="230"/>
    <text class="rot" x="150" y="208">altura do teclado</text>
    <!-- pedal -->
    <rect class="banco" x="470" y="345" width="40" height="8" rx="2"/>
  </g>

  <!-- pessoa + banco: o grupo sobe e desce com o banco -->
  <g id="pessoa">
    <!-- banco -->
    <g>
      <rect class="banco" x="140" y="282" width="120" height="16" rx="4">
        <animate attributeName="y" values="300;300;282;282;282" keyTimes="0;.2;.45;.9;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
      </rect>
      <rect class="banco" x="152" y="298" width="10" height="62">
        <animate attributeName="y" values="316;316;298;298;298" keyTimes="0;.2;.45;.9;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="44;44;62;62;62" keyTimes="0;.2;.45;.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect class="banco" x="238" y="298" width="10" height="62">
        <animate attributeName="y" values="316;316;298;298;298" keyTimes="0;.2;.45;.9;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="44;44;62;62;62" keyTimes="0;.2;.45;.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- corpo (sentado, de perfil, olhando para a direita) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 0" keyTimes="0;.2;.45;.9;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
      <!-- coxa e perna -->
      <path class="corpo" d="M215 285 L300 285 L300 360"/>
      <path class="corpo" d="M300 360 L330 360"/>
      <!-- tronco -->
      <path class="corpo" d="M215 285 L228 170"/>
      <!-- cabeça -->
      <circle class="cabeca" cx="236" cy="140" r="22"/>
      <!-- braço: ombro → cotovelo → mão; o antebraço fica horizontal quando o banco está certo -->
      <path class="corpo" d="M228 178 L270 236 L402 236">
        <animate attributeName="d" values="M228 178 L270 236 L402 236;M228 178 L270 236 L402 236;M228 178 L270 236 L402 236" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- veredito -->
  <g>
    <text class="mau" x="24" y="300">
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;.2;.45;.9;1" dur="6s" repeatCount="indefinite"/>
      banco baixo: o antebraço sobe para as teclas
    </text>
    <text class="ok" x="24" y="300">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.45;.9;1" dur="6s" repeatCount="indefinite"/>
      ✓ antebraço paralelo ao chão, cotovelo à frente do corpo
    </text>
  </g>
  <text class="rot" x="24" y="385">PÉS NO CHÃO · COSTAS RETAS SEM RIGIDEZ · OMBROS CAÍDOS</text>
</svg>
